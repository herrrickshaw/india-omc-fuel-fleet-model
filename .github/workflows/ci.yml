name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check omc_model.py fleet_from_fuel.py energy_blend_comparison.py vahan/analyze_vahan_fuel.py tests  # Phase 1 modules
      - run: pytest -q
